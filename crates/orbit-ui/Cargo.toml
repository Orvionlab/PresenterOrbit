[package]
name = "orbit-ui"
version.workspace = true
description = "Presenter Orbit GPUI theme, primitives, icons, and translations"
authors = ["Orvion Lab"]
license = "GPL-3.0-only"
edition = "2021"
publish = false

[lib]
test = false
doctest = false

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui-base = "=0.9.0"
serde_json = "1"
sys-locale = "0.3"
image = { version = "0.25.10", default-features = false }
smallvec = "1"
