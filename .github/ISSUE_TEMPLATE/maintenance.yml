name: Maintenance work
description: A bounded maintenance task with explicit ownership and expiry.
title: "maintenance: "
labels: [maintenance]
body:
  - type: input
    id: owner
    attributes:
      label: Owner
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason and risk
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and verification
    validations:
      required: true
  - type: input
    id: expiry
    attributes:
      label: Expiry date (YYYY-MM-DD)
    validations:
      required: true
